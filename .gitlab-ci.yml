stages:
  - smoke

smoke-test:
  stage: smoke
  tags:
    - daves-vps
  image: node:22
  before_script:
    - node --version
  script:
    - node toolkit/Smoke-Test.js --fast
  artifacts:
    when: always
    paths:
      - docs/smoke-test-report.json
    expire_in: 30 days

live-certification:
  stage: smoke
  tags:
    - daves-vps
  image: node:22
  script:
    - node toolkit/Smoke-Test.js
  artifacts:
    when: always
    paths:
      - docs/smoke-test-report.json
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
