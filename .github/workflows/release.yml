name: Release

# Triggers only when a maintainer pushes a tag matching vX.Y.Z (or vX.Y.Z-rcN).
# Builds the Windows-ready ZIP via toolkit/Build-Release.ps1, verifies it via
# toolkit/Verify-Release.ps1, and uploads the artifact to the GitHub Release
# via softprops/action-gh-release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/version to build (e.g., 1.2.0). Empty = use latest git tag.'
        required: false
        default: ''

permissions:
  contents: write   # create GitHub Release

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned PowerShell quality tools
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $version = if ($env:VERSION_OVERRIDE -and $env:VERSION_OVERRIDE.Trim()) {
            $env:VERSION_OVERRIDE.Trim()
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $tag = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | Select-Object -First 1
            if ($tag) { $tag.Substring(1) } else { '0.0.0' }
          }
          Write-Host ("Resolved version: {0}" -f $version)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the Windows-ready release ZIP
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File toolkit/Build-Release.ps1 -Version $version -OutDir dist
          if ($LASTEXITCODE -ne 0) { throw "Build-Release.ps1 failed (exit $LASTEXITCODE)" }

      - name: Verify the release ZIP (full gate)
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/daves-tools-v$version.zip"
          powershell -NoProfile -ExecutionPolicy Bypass -File toolkit/Verify-Release.ps1 -ZipPath $zip -KeepExtract
          if ($LASTEXITCODE -ne 0) { throw "Verify-Release.ps1 failed (exit $LASTEXITCODE)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daves-tools-release-${{ steps.version.outputs.version }}
          path: |
            dist/daves-tools-v${{ steps.version.outputs.version }}.zip
            dist/daves-tools-v${{ steps.version.outputs.version }}.zip.sha256
            dist/daves-tools-v${{ steps.version.outputs.version }}/RELEASE.json
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: daves-tools ${{ github.ref_name }}
          body: |
            Windows-ready release of daves-tools ${{ github.ref_name }}.

            See CHANGELOG.md for the full list of changes since the previous tag.
          files: |
            dist/daves-tools-${{ github.ref_name }}.zip
            dist/daves-tools-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
